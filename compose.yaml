services:
  backend:
    build:
      context: ./backend
    environment:
      AGENTAPI_AUTH_STATIC_ENABLED: "false"
      AGENTAPI_AUTH_GITHUB_ENABLED: "false"
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-agentapi-proxy}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=development,service.namespace=ccplant}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      AGENTAPI_PROXY_URL: http://backend:8080
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - "3000:3000"
