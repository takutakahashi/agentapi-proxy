{{- $manager := .Values.sessionManager | default dict }}
{{- $k8s := $manager.kubernetesSession | default dict }}
{{- $rbac := $k8s.rbac | default dict }}
{{- $rbacCreate := true }}
{{- if hasKey $rbac "create" }}{{- $rbacCreate = $rbac.create }}{{- end }}
{{- if and ($manager.enabled | default false) ($k8s.enabled | default false) $rbacCreate }}
{{- $scia := $manager.scia | default dict }}
{{- $sciaEnabled := dig "enabled" false $scia }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $k8s.serviceAccountName | default "agentapi-proxy-session" }}
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
rules:
  # Minimal permissions for session pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  {{- if $sciaEnabled }}
  # Dynamic scia users create per-user refresh-token Secrets at runtime, so
  # session pods cannot enumerate resourceNames ahead of time.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  {{- end }}
{{- end }}
