{{- $manager := .Values.sessionManager | default dict }}
{{- $k8s := $manager.kubernetesSession | default dict }}
{{- if and ($manager.enabled | default false) ($k8s.enabled | default false) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentapi-proxy.fullname" . }}-session-manager
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-manager
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # update: required for adoptStockSession when stock sessions run as Pods.
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    # patch: required for UpdateSlackLastMessageAt (agentapi.proxy/slack-last-message-at annotation)
    # update: required for UpdateServiceAnnotation (e.g. agentapi.proxy/updated-at annotation)
    verbs: ["get", "list", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    # Lazy chat recovery checks whether the session Service has a ready Pod.
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    # update/patch: required when a stock session is adopted and its PVC
    # owner reference is transferred to the allocated workload.
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # update/patch: required for adoptStockSession (removing agentapi.proxy/stock label)
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
{{- end }}
