{{- $rbac := .Values.kubernetesSession.rbac | default dict }}
{{- $rbacCreate := true }}
{{- if hasKey $rbac "create" }}{{- $rbacCreate = $rbac.create }}{{- end }}
{{- if and .Values.kubernetesSession .Values.kubernetesSession.enabled $rbacCreate }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.kubernetesSession.serviceAccountName | default "agentapi-proxy-session" }}
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
