{{- $control := .Values.controlPlaneService | default dict }}
{{- $enabled := true }}
{{- $create := true }}
{{- $retain := true }}
{{- if hasKey $control "enabled" }}{{- $enabled = $control.enabled }}{{- end }}
{{- if hasKey $control "create" }}{{- $create = $control.create }}{{- end }}
{{- if hasKey $control "retainOnDelete" }}{{- $retain = $control.retainOnDelete }}{{- end }}
{{- if and $enabled $create }}
{{- $annotations := deepCopy ($control.annotations | default dict) }}
{{- if $retain }}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $control.name | default "control" | quote }}
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $control.port | default 8080 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- if $control.selector }}
    {{- toYaml $control.selector | nindent 4 }}
    {{- else }}
    {{- include "agentapi-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
    {{- end }}
{{- end }}
