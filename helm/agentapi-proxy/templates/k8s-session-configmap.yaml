{{- $k8s := .Values.kubernetesSession | default dict }}
{{- if (dig "enabled" false (.Values.sessionManager | default dict)) }}
{{- $k8s = dig "kubernetesSession" (dict) .Values.sessionManager }}
{{- end }}
{{- if or $k8s.nodeSelector $k8s.affinity $k8s.tolerations $k8s.podTemplate }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentapi-proxy.fullname" . }}-k8s-session-config
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
data:
  k8s-session-config.yaml: |
    kubernetes_session:
      {{- if $k8s.nodeSelector }}
      node_selector:
        {{- range $key, $value := $k8s.nodeSelector }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
      {{- if $k8s.affinity }}
      affinity:
        {{- toYaml $k8s.affinity | nindent 8 }}
      {{- end }}
      {{- if $k8s.tolerations }}
      tolerations:
        {{- range $k8s.tolerations }}
        - key: {{ .key | quote }}
          {{- if .operator }}
          operator: {{ .operator | quote }}
          {{- end }}
          {{- if .value }}
          value: {{ .value | quote }}
          {{- end }}
          {{- if .effect }}
          effect: {{ .effect | quote }}
          {{- end }}
          {{- if .tolerationSeconds }}
          toleration_seconds: {{ .tolerationSeconds }}
          {{- end }}
        {{- end }}
      {{- end }}
  {{- if $k8s.podTemplate }}
  session-pod-template.yaml: |
    {{- toYaml $k8s.podTemplate | nindent 4 }}
  {{- end }}
{{- end }}
