# Example configuration file for agentapi-proxy
# This file demonstrates all available configuration options
# Values can be overridden by environment variables with AGENTAPI_ prefix

# Persistence for application KV data represented as Secrets and ConfigMaps.
# Inject auth_token with AGENTAPI_KV_STORE_AUTH_TOKEN in production.
kv_store:
  backend: kubernetes
  database_url: ""
  auth_token: ""
  # To mirror application KV writes, replace the legacy fields above with:
  # primary:
  #   backend: kubernetes
  # secondary:
  #   backend: libsql
  #   database_url: "libsql://example.turso.io"
  #   auth_token: ""
  # replication:
  #   mode: rollback # rollback or best_effort

# Authentication configuration
auth:
  enabled: false
  
  # Static API key authentication
  static:
    enabled: false
    header_name: "X-API-Key"
    keys_file: ""  # Path to external API keys file
    api_keys: []
  
  # GitHub OAuth authentication
  github:
    enabled: false
    base_url: "https://api.github.com"
    token_header: "Authorization"
    
    # User role mapping
    user_mapping:
      default_role: "user"
      default_permissions: ["session:create"]
      team_role_mapping: {}
    
    # OAuth configuration
    oauth:
      client_id: "${AGENTAPI_AUTH_GITHUB_OAUTH_CLIENT_ID}"
      client_secret: "${AGENTAPI_AUTH_GITHUB_OAUTH_CLIENT_SECRET}"
      scope: "read:user read:org project"
      base_url: ""  # Defaults to auth.github.base_url
