{{- $manager := .Values.sessionManager | default dict }}
{{- $github := $manager.github | default dict }}
{{- $tokenRefName := dig "tokenRef" "name" "" $github }}
{{- $tokenRefKey := dig "tokenRef" "key" "github-token" $github }}
{{- $hasToken := or (dig "token" "" $github) $tokenRefName }}
{{- $hasApp := and (dig "app" "id" "" $github) (dig "app" "privateKey" "secretName" "" $github) }}
{{- $k8sEnabled := dig "kubernetesSession" "enabled" false $manager }}
{{- if and ($manager.enabled | default false) $k8sEnabled (or $hasToken $hasApp) }}
{{- /*
  GitHub Session Secret (Authentication)
  This Secret contains GitHub authentication credentials for the clone-repo init container
  in session pods. Uses sessionManager.github settings from values.yaml.

  Supports two authentication methods:
  1. Personal Access Token (github.token)
  2. GitHub App (github.app.id, github.app.privateKey.secretName)

  The PEM content is read from the existing Secret specified in github.app.privateKey.secretName
  using Helm's lookup function. This requires the PEM Secret to exist before running helm install/upgrade.

  Note: GITHUB_API and GITHUB_URL are in a separate Secret (github-config) so that
  params.github_token can override authentication without losing Enterprise Server settings.
*/}}
{{- $pemSecret := "" }}
{{- $tokenSecret := "" }}
{{- if $tokenRefName }}
{{- $existingTokenSecret := lookup "v1" "Secret" .Release.Namespace $tokenRefName }}
{{- if $existingTokenSecret }}
{{- $tokenSecret = index $existingTokenSecret.data $tokenRefKey | default "" }}
{{- end }}
{{- end }}
{{- $pemKey := dig "app" "privateKey" "key" "private-key" $github }}
{{- $pemSecretName := dig "app" "privateKey" "secretName" "" $github }}
{{- if $pemSecretName }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $pemSecretName }}
{{- if $existingSecret }}
{{- $pemSecret = index $existingSecret.data $pemKey | default "" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentapi-proxy.fullname" . }}-github-session
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: github-session-credentials
type: Opaque
data:
  {{- if $tokenSecret }}
  GITHUB_TOKEN: {{ $tokenSecret }}
  {{- end }}
  {{- /* PEM from existing Secret (base64 encoded) */}}
  {{- if $pemSecret }}
  GITHUB_APP_PEM: {{ $pemSecret }}
  {{- end }}
stringData:
  {{- /* Personal Access Token */}}
  {{- if (dig "token" "" $github) }}
  GITHUB_TOKEN: {{ dig "token" "" $github | quote }}
  {{- end }}
  {{- /* GitHub App credentials from github.app settings */}}
  {{- if (dig "app" "id" "" $github) }}
  GITHUB_APP_ID: {{ dig "app" "id" "" $github | quote }}
  {{- end }}
  {{- if (dig "app" "installationId" "" $github) }}
  GITHUB_INSTALLATION_ID: {{ dig "app" "installationId" "" $github | quote }}
  {{- end }}
  REPOSITORY_RESTRICTION: {{ dig "app" "repositoryRestriction" false $github | quote }}
{{- end }}
---
{{- /*
  GitHub Config Secret (Enterprise Server Settings)
  This Secret contains GitHub Enterprise Server URL settings.
  Kept separate from authentication credentials so that params.github_token
  can override GITHUB_TOKEN without losing GITHUB_API and GITHUB_URL settings.
*/}}
{{- $githubEnterpriseApiUrl := dig "enterprise" "apiUrl" "" $github }}
{{- $githubEnterpriseBaseUrl := dig "enterprise" "baseUrl" "" $github }}
{{- if and ($manager.enabled | default false) $k8sEnabled (or $githubEnterpriseApiUrl $githubEnterpriseBaseUrl) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentapi-proxy.fullname" . }}-github-config
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: github-config
type: Opaque
stringData:
  {{- if $githubEnterpriseApiUrl }}
  GITHUB_API: {{ $githubEnterpriseApiUrl | quote }}
  {{- end }}
  {{- if $githubEnterpriseBaseUrl }}
  GITHUB_URL: {{ $githubEnterpriseBaseUrl | quote }}
  {{- end }}
{{- end }}
