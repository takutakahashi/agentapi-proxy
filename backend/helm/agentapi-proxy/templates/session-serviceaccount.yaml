{{- $manager := .Values.sessionManager | default dict }}
{{- $k8s := $manager.kubernetesSession | default dict }}
{{- $rbac := $k8s.rbac | default dict }}
{{- $rbacCreate := true }}
{{- if hasKey $rbac "create" }}{{- $rbacCreate = $rbac.create }}{{- end }}
{{- if and ($manager.enabled | default false) ($k8s.enabled | default false) $rbacCreate }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $k8s.serviceAccountName | default "agentapi-proxy-session" }}
  labels:
    {{- include "agentapi-proxy.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
