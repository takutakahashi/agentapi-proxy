[package]
name = "agentapi-proxy-native-dashboard"
version = "0.1.0"
description = "macOS menu-bar dashboard for the agentapi-proxy native External Session Manager"
authors = ["ccplant"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "agentapi_proxy_native_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
