apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "session-manager.fullname" . }}
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "session-manager.fullname" . }}
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "session-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "session-manager.fullname" . }}
